<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XP Barato · o menor preço do seu jogo</title>
  <meta name="description" content="Compare o preço dos jogos entre as lojas e vá direto para a promoção.">
  <meta name="theme-color" content="#0D1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="carregando"><div class="spinner" aria-hidden="true"></div>Carregando…</div>
  </div>
  <nav id="barra" class="barra" hidden>
    <a href="#/inicio" data-aba="inicio"><span class="ico" aria-hidden="true">⌂</span>Início</a>
    <a href="#/conta" data-aba="conta"><span class="ico" aria-hidden="true">◉</span>Conta</a>
  </nav>
  <div id="aviso" class="aviso" role="status" hidden></div>
  <noscript>O XP Barato precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
