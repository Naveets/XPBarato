# Robô de preços do XP Barato
# Roda todo dia às 06:00 (horário de Brasília), consulta os preços e salva em dados/.
# Também dá para rodar na hora: aba Actions → "Robô de preços" → Run workflow.
name: Robô de preços

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dados/catalogo.json'
      - 'robo/**'

permissions:
  contents: write

concurrency:
  group: robo-de-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar preços
        run: node robo/atualizar-precos.mjs
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}

      - name: Salvar no repositório
        run: |
          git config user.name "robo-xpbarato"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/precos.json dados/historico.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Robô: preços de $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git push
          fi
